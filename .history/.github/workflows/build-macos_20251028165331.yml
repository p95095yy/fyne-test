name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 👇 ここを追加
      - name: Hello world
        run: |
          echo "Hello World from GitHub Actions"
          date

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.0

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Create dummy icon
        run: |
          convert -size 64x64 xc:skyblue -gravity center -pointsize 20 \
            -annotate 0 "App" Icon.png

      - name: Check directory before build
        run: |
          echo "--- Current working directory ---"
          pwd
          echo "--- Files and folders ---"
          ls -la
          echo "--- 3-level file tree ---"
          find . -maxdepth 3 -type f | sort

      - name: Build app bundle
        run: |
          env CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 fyne package \
            -os darwin -name fyne-test -release -icon Icon.png
          echo "--- .app bundle contents ---"
          ls -R fyne-test.app
          echo "--- ditto zip ---"
          ditto -c -k --sequesterRsrc --keepParent fyne-test.app fyne-test.zip
          ls -lh fyne-test.zip

      - name: Check directory before build2
        run: |
          echo "--- Current working directory ---"
          pwd
          echo "--- Files and folders ---"
          ls -la
          echo "--- 3-level file tree ---"
          find . -maxdepth 3 -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fyne-test-mac
          path: fyne-test.zip
