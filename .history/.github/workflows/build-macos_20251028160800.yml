name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.0

      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Check working directory before icon creation
        run: |
          echo "--- pwd ---"
          pwd
          echo "--- ls ---"
          ls -a

      - name: Create dummy icon
        run: |
          echo "--- creating dummy icon ---"
          magick -size 64x64 xc:skyblue -gravity center -pointsize 20 \
            -annotate 0 "App" Icon.png
          echo "--- after create ---"
          ls -l
          file Icon.png || true

      - name: Check directory again
        run: |
          echo "--- after icon creation ---"
          pwd
          ls -a

      - name: Build app bundle
        run: |
          echo "--- building fyne package ---"
          pwd
          ls -a
          env CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 fyne package \
            -os darwin -name fyne-test -release
          echo "--- .app bundle contents ---"
          ls -R fyne-test.app || true
          echo "--- ditto zip ---"
          ditto -c -k --sequesterRsrc --keepParent fyne-test.app fyne-test.zip || true
          ls -lh fyne-test.zip || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fyne-test-mac
          path: fyne-test.zip
